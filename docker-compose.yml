services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://scoutbase:scoutbase@postgres:5432/scoutbase
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting}
      SCOUTBASE_API_TOKEN: ${SCOUTBASE_API_TOKEN:?Set SCOUTBASE_API_TOKEN before starting}
      SCOUTBASE_ADMIN_TOKEN: ${SCOUTBASE_ADMIN_TOKEN:?Set SCOUTBASE_ADMIN_TOKEN before starting}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL before starting}
      GITHUB_ACTIONS_TOKEN: ${GITHUB_ACTIONS_TOKEN:-}
      GITHUB_ACTIONS_OWNER: ${GITHUB_ACTIONS_OWNER:-}
      GITHUB_ACTIONS_REPO: ${GITHUB_ACTIONS_REPO:-}
      GITHUB_ACTIONS_WORKFLOW: ${GITHUB_ACTIONS_WORKFLOW:-discovery.yml}
      GITHUB_ACTIONS_REF: ${GITHUB_ACTIONS_REF:-main}
      BTC_TREASURY_ADDRESS: ${BTC_TREASURY_ADDRESS:-}
      ETH_TREASURY_ADDRESS: ${ETH_TREASURY_ADDRESS:-}
      TRON_TREASURY_ADDRESS: ${TRON_TREASURY_ADDRESS:-}
      TON_TREASURY_ADDRESS: ${TON_TREASURY_ADDRESS:-}
      GEM_SYMBOL: ${GEM_SYMBOL:-GEM}
      GEM_CHAIN: ${GEM_CHAIN:-}
      GEM_CONTRACT_ADDRESS: ${GEM_CONTRACT_ADDRESS:-}
      GEM_DECIMALS: ${GEM_DECIMALS:-18}
      GEM_TREASURY_ADDRESS: ${GEM_TREASURY_ADDRESS:-}
      CHAOS_API_KEY: ${CHAOS_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "server/api.js"]

  worker:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://scoutbase:scoutbase@postgres:5432/scoutbase
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "server/worker.js"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scoutbase
      POSTGRES_USER: scoutbase
      POSTGRES_PASSWORD: scoutbase
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutbase -d scoutbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
