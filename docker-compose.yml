services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://scoutbase:scoutbase@postgres:5432/scoutbase
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting}
      SCOUTBASE_API_TOKEN: ${SCOUTBASE_API_TOKEN:?Set SCOUTBASE_API_TOKEN before starting}
      CHAOS_API_KEY: ${CHAOS_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "server/api.js"]

  worker:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://scoutbase:scoutbase@postgres:5432/scoutbase
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "server/worker.js"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: scoutbase
      POSTGRES_USER: scoutbase
      POSTGRES_PASSWORD: scoutbase
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoutbase -d scoutbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
